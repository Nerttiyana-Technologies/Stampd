#-------------------------------------------------------------------------------#
#        Discover additional configuration options in our documentation         #
#               https://www.jetbrains.com/help/qodana/github.html               #
#-------------------------------------------------------------------------------#

name: Qodana
on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  # Push-to-main trigger removed for cost — Qodana is slow (~5 min) and we
  # already run it on every PR. Re-add `push: branches: [main]` if you want
  # baseline scans on direct main pushes; current state assumes PR coverage.

# Cancel in-flight Qodana runs when new commits land on the same PR.
concurrency:
  group: qodana-${{ github.ref }}
  cancel-in-progress: true

# File-level least-privilege default. Per-job permissions below escalate where
# strictly needed. Required by OSSF Scorecard TokenPermissionsID rule.
permissions:
  contents: read

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      # contents: read is sufficient because push-fixes is 'none' below.
      # If push-fixes is ever flipped to 'pull-request' or 'branch', escalate
      # to contents: write at that point. Least-privilege default per OSSF
      # Scorecard TokenPermissions guidance.
      contents: read
      pull-requests: write   # for post-pr-comment: true
      checks: write          # for use-annotations: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@b588768b6e7e6da579e518bc584f79de0d243692 # v2026.1
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          # When pr-mode is set to true, Qodana analyzes only the files that have been changed
          pr-mode: false
          use-caches: true
          post-pr-comment: true
          use-annotations: true
          # Upload Qodana results (SARIF, other artifacts, logs) as an artifact to the job
          upload-result: false
          # quick-fixes available in Ultimate and Ultimate Plus plans
          push-fixes: 'none'